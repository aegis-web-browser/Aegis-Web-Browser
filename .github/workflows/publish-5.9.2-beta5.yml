name: Publish Aegis Web 5.9.2 beta 5 (public pre-release)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-5.9.2-beta5.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aegis-5.9.2-beta.5-public-release
  cancel-in-progress: false

jobs:
  publish-beta:
    if: github.repository == 'aegis-web-browser/Aegis-Web-Browser'
    runs-on: windows-latest
    steps:
      - name: Checkout exact tested beta source
        uses: actions/checkout@v4
        with:
          ref: '8ebfb5cb8d55b3a7b0e1a227a92a7b5de1145e39'
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify beta 5 source and exact revision
        shell: pwsh
        run: |
          $package = Get-Content package.json -Raw | ConvertFrom-Json
          if ($package.version -ne '5.9.2-beta.5') { throw "Unexpected version: $($package.version)" }
          $head = git rev-parse HEAD
          if ($head -ne '8ebfb5cb8d55b3a7b0e1a227a92a7b5de1145e39') { throw "Wrong source revision: $head" }
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate syntax
        run: npm run lint:syntax
      - name: Run unit tests
        run: npm test
      - name: Build Windows beta installer
        run: npm run build -- --publish never
      - name: Prepare downloadable installer and checksums
        shell: pwsh
        run: |
          $original = 'dist/Aegis-Web-Setup-5.9.2-beta.5.exe'
          $target = 'dist/Aegis-Web-Setup-Windows.exe'
          if (!(Test-Path -LiteralPath $original)) { throw "Installer missing: $original" }
          Move-Item -LiteralPath $original -Destination $target -Force
          $digest = (Get-FileHash -LiteralPath $target -Algorithm SHA256).Hash.ToLowerInvariant()
          "$digest  Aegis-Web-Setup-Windows.exe" | Set-Content -LiteralPath 'dist/SHA256SUMS.txt' -Encoding ascii
          Write-Host "Installer SHA256: $digest"
      - name: Checkout release notes from main
        shell: pwsh
        run: |
          $notesUrl = "https://raw.githubusercontent.com/$env:GITHUB_REPOSITORY/main/RELEASE-NOTES-5.9.2-BETA.5.md"
          Invoke-WebRequest -Uri $notesUrl -OutFile 'dist/BETA-NOTES.md'
      - name: Create GitHub PUBLIC PRERELEASE only (not latest stable)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view '5.9.2-beta.5' --repo $env:GITHUB_REPOSITORY --json tagName *> $null
          if ($LASTEXITCODE -eq 0) { Write-Host "Already published, will not replace existing assets"; exit 0 }
          gh release create '5.9.2-beta.5' 'dist/Aegis-Web-Setup-Windows.exe' 'dist/SHA256SUMS.txt' --repo $env:GITHUB_REPOSITORY --target '8ebfb5cb8d55b3a7b0e1a227a92a7b5de1145e39' --title 'Aegis Web 5.9.2 beta 5 — Windows preview' --notes-file 'dist/BETA-NOTES.md' --prerelease --latest=false
          if ($LASTEXITCODE -ne 0) { throw "Public beta release creation failed" }
